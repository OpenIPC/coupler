      - name: Upload binaries to release
        # Creates the release on the first run; on later runs overwrite: true
        # also brings its title and description back to the ones below.
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.OUTPUTDIR }}/*
          file_glob: true
          tag: ${{ env.TAG_NAME }}
          release_name: ${{ env.RELEASE_NAME }}
          body: |
            Transition firmware for Anjoy boards

            Instructions: https://github.com/OpenIPC/coupler#anjoy
          prerelease: ${{ env.PRERELEASE }}
          overwrite: true
