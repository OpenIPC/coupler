name: Anjoy to OpenIPC

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: setenv
        run: |
          TAG_NAME="anjoy"
          RELEASE_NAME="OpenIPC Firmware"
          PRERELEASE=true
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "RELEASE_NAME=$RELEASE_NAME" >> $GITHUB_ENV
          echo "PRERELEASE=$PRERELEASE" >> $GITHUB_ENV
          echo "OUTPUTDIR=$GITHUB_WORKSPACE/.github/workflows/out" >> $GITHUB_ENV
          echo "DLDIR=$GITHUB_WORKSPACE/.github/workflows/dl" >> $GITHUB_ENV
      - name: Install dependencies
        run: sudo apt-get update; sudo apt-get install -y u-boot-tools zip xxd
      - name: Checkout
        uses: actions/checkout@v2.3.4
      - name: Fetch OpenIPC release
        run: |
          mkdir -p "$DLDIR" ; cd "$_"
          wget -q --content-disposition "https://openipc.org/cameras/vendors/sigmastar/socs/ssc378de/download_full_image?flash_size=8&flash_type=nor&fw_release=lite&layout=8"

      - name: Create firmwares
        run: |
          mkdir -p $OUTPUTDIR; cd "$_"
          export RUN="$GITHUB_WORKSPACE/.github/workflows/_anjoy2oipc.py"

          $RUN --uboot-size 0x30000 --kernel-size 0x200000 --kernel-version MSTAR_I6C_LINUX_378DE --rootfs-size 0xcd0000 --rootfs-version MCJ86_V0-A-H5_V3.2.5.6 ${DLDIR}/openipc-ssc378de-nor-lite-8mb.bin

        continue-on-error: true
      - name: Create release
        uses: actions/create-release@v1
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG_NAME }}
          release_name: ${{ env.RELEASE_NAME }}
          body: |
            Transition firmware for Anjoy boards
          draft: false
          prerelease: ${{ env.PRERELEASE }}
      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.OUTPUTDIR }}/*
          file_glob: true
          tag: ${{ env.TAG_NAME }}
          overwrite: true
