          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.OUTPUTDIR }}/*
          file_glob: true
          tag: ${{ env.TAG_NAME }}
          release_name: ${{ env.RELEASE_NAME }}
