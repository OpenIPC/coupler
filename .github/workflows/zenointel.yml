name: Zenointel to OpenIPC

# Builds Zenointel / GK7205 "hunter" (Dahua-derived) OpenIPC upgrade packages and
# publishes them to the `zenointel` release tag. Mirrors xm.yml. The push to a
# camera is external: ~/git/python-dhip over Dahua DHIP (TCP 5000) — see the
# zenointel project's docs/openipc-transition.md.
#
# The builder + packaging + DHIP flash are VALIDATED on hardware (GK7205V510
# SD-2N-4G booted OpenIPC keeping stock u-boot). The one CI blocker: the fetch
# step needs an upstream OpenIPC **gk7205v500-family NAND (ultimate)** artifact that
# is not published yet (upstream ships only an 8 MiB NOR config). Until it is
# published this workflow's fetch fails; build the artifact locally with
# `make BOARD=gk7205v500_ultimate` to run the packaging + flash by hand.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: setenv
        run: |
          echo "TAG_NAME=zenointel" >> $GITHUB_ENV
          echo "RELEASE_NAME=Zenointel" >> $GITHUB_ENV
          echo "PRERELEASE=true" >> $GITHUB_ENV
      - name: Install dependencies
        run: sudo apt-get update; sudo apt-get install -y u-boot-tools zip
      - name: Checkout
        uses: actions/checkout@v2.3.4
      - name: Fetch OpenIPC release
        run: |
          # Since 2026-11 the per-model NAND artifact is published by the
          # OpenIPC/builder first-class device config (Zenointel SD-2N-4G) in
          # dated nightly prereleases, NOT under the old
          # openipc.gk7205v500-nand-ultimate.tgz firmware-release name.
          # Resolve the newest dated nightly tag and pull the artifact from it.
          TAG=$(curl -s "https://api.github.com/repos/OpenIPC/builder/releases?per_page=30" \
            | jq -r '[.[] | select(.tag_name | startswith("nightly-202")) | .tag_name][0]')
          [ -n "${TAG}" ] || { echo "::error::no dated nightly tag in OpenIPC/builder"; exit 1; }
          echo "TAG=${TAG}" >> $GITHUB_ENV
          wget -q "https://github.com/OpenIPC/builder/releases/download/${TAG}/gk7205v510_ultimate_zenointel-sd-2n-4g-nand.tgz" || {
            echo "::error::zenointel-sd-2n-4g NAND artifact missing from ${TAG}"
            exit 1
          }
      - name: Create firmwares
        run: |
          export RUN="$GITHUB_WORKSPACE/.github/workflows/_zenointel2oipc.sh"
          export OUTPUTDIR="$GITHUB_WORKSPACE/out"
          chmod +x $RUN
          # One line per supported unit. Identity gate = CPU + VENDOR + MODEL/HWVER
          # (the DEVID analogue). Keep VENDOR matched to the unit's OEM.
          # ARTIFACT = the per-model builder-nightly tgz (members: fitImage + rootfs.ubi).
          # NC-IPTC2400_DL_4G-4: not published by OpenIPC/builder yet; add its tgz
          # to the fetch step once the device config lands upstream.
          ARTIFACT="gk7205v510_ultimate_zenointel-sd-2n-4g-nand.tgz" \
          SOC="gk7205v510" FAMILY="gk7205v500" CPU="GK7205V510" VENDOR="Rostelecom" MODEL="NC-IPTC2200_DL_4G-4" HWVER="2.00" $RUN
      - name: Upload binaries to release
        # Creates the release on the first run; on later runs overwrite: true
        # also brings its title and description back to the ones below.
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: out/*
          tag: ${{ env.TAG_NAME }}
          release_name: ${{ env.RELEASE_NAME }}
          body: |
            Transition firmware for Zenointel boards

            Instructions: https://github.com/OpenIPC/coupler#zenointel
          prerelease: ${{ env.PRERELEASE }}
          overwrite: true
          file_glob: true
